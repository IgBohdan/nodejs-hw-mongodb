components:
  schemas:
    Contact:
      type: object
      required:
        - name
        - phoneNumber
        - contactType
        - userId
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 20
          description: The name of the contact
        phoneNumber:
          type: string
          minLength: 3
          maxLength: 20
          description: The phone number of the contact
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 20
          description: The email address of the contact
        isFavourite:
          type: boolean
          default: false
          description: Indicates if the contact is marked as favorite
        contactType:
          type: string
          enum: [work, home, personal]
          default: personal
          description: The type of contact
        userId:
          type: string
          description: The ID of the user who owns the contact
        photo:
          type: string
          description: URL of the contact's photo
        _id:
          type: string
          description: The unique identifier of the contact
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the contact was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the contact was last updated
    ContactResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Successfully found contact with id {contactId}!
        data:
          $ref: '#/components/schemas/Contact'
    User:
      type: object
      required:
        - name
        - email
        - _id
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 20
          description: The name of the user
        email:
          type: string
          format: email
          description: The email address of the user
        _id:
          type: string
          description: The unique identifier of the user
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the user was created
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the user was last updated
    UserResponse:
      type: object
      properties:
        status:
          type: integer
          example: 201
        message:
          type: string
          example: Successfully registered a user!
        data:
          $ref: '#/components/schemas/User'
    AuthResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Successfully logged in an user!
        data:
          type: object
          properties:
            accessToken:
              type: string
              description: JWT access token for authentication
    ResetResponse:
      type: object
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Reset password email has been successfully sent.
        data:
          type: object
          description: Empty object for successful operations
    Error:
      type: object
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: User not found
        data:
          type: string
          example: User not found
