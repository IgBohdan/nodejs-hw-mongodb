get:
  tags:
    - Contacts
  summary: Retrieve a paginated list of contacts
  operationId: getContacts
  description: Retrieves a paginated list of contacts for the authenticated user, with optional filtering and sorting.
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: page
      schema:
        type: integer
        default: 1
      description: The page number for pagination
    - in: query
      name: perPage
      schema:
        type: integer
        default: 10
      description: Number of contacts per page
    - in: query
      name: sortBy
      schema:
        type: string
        enum: [name, phoneNumber, email, contactType]
        default: name
      description: Field to sort by
    - in: query
      name: sortOrder
      schema:
        type: string
        enum: [asc, desc]
        default: asc
      description: Sort order (ascending or descending)
    - in: query
      name: type
      schema:
        type: string
        enum: [work, home, personal]
      description: Filter by contact type
    - in: query
      name: isFavourite
      schema:
        type: boolean
      description: Filter by favorite status
  responses:
    '200':
      description: Successfully retrieved contacts
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contacts!
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '../../components/schemas.yaml#/components/schemas/Contact'
                  page:
                    type: integer
                    example: 1
                  perPage:
                    type: integer
                    example: 10
                  totalItems:
                    type: integer
                    example: 50
                  totalPages:
                    type: integer
                    example: 5
                  hasPreviousPage:
                    type: boolean
                    example: false
                  hasNextPage:
                    type: boolean
                    example: true
    '400':
      description: Invalid query parameters
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/components/schemas/Error'
