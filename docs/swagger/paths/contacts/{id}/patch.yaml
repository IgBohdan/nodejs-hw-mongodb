patch:
  tags:
    - Contacts
  summary: Update a contact
  operationId: updateContact
  description: Updates an existing contact by ID for the authenticated user, with an optional photo upload.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      schema:
        type: string
      required: true
      description: The ID of the contact to update
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              minLength: 3
              maxLength: 20
              description: The name of the contact
            phoneNumber:
              type: string
              minLength: 3
              maxLength: 20
              description: The phone number of the contact
            email:
              type: string
              format: email
              minLength: 3
              maxLength: 20
              description: The email address of the contact
            isFavourite:
              type: boolean
              description: Indicates if the contact is marked as favorite
            contactType:
              type: string
              enum: [work, home, personal]
              description: The type of contact
            photo:
              type: string
              format: binary
              description: The contact's photo file
          minProperties: 1
  responses:
    '200':
      description: Successfully updated the contact
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas.yaml#/components/schemas/ContactResponse'
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas.yaml#/components/schemas/Error'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas.yaml#/components/schemas/Error'
