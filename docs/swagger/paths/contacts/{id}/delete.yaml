delete:
  tags:
    - Contacts
  summary: Delete a contact
  operationId: deleteContact
  description: Deletes a specific contact by its ID for the authenticated user.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      schema:
        type: string
      required: true
      description: The ID of the contact to delete
  responses:
    '204':
      description: Successfully deleted the contact
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas.yaml#/components/schemas/Error'
