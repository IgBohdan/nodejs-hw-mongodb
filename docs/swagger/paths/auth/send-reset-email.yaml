post:
  tags:
    - Authentication
  summary: Send password reset email
  operationId: sendResetEmail
  description: Sends a password reset email with a token to the specified email address.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
          properties:
            email:
              type: string
              format: email
              description: The email address to send the reset link to
  responses:
    '200':
      description: Successfully sent the password reset email
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/components/schemas/ResetResponse'
    '400':
      description: Invalid email
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/components/schemas/Error'
    '404':
      description: User not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/components/schemas/Error'
    '500':
      description: Failed to send email
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/components/schemas/Error'
