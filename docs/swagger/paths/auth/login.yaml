post:
  tags:
    - Authentication
  summary: Log in a user
  operationId: loginUser
  description: Logs in a user with the provided email and password, returning an access token and setting a refresh token cookie.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - email
            - password
          properties:
            email:
              type: string
              format: email
              description: The email address of the user
            password:
              type: string
              description: The password for the user
  responses:
    '200':
      description: Successfully logged in a user
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/components/schemas/AuthResponse'
      headers:
        Set-Cookie:
          schema:
            type: string
            example: refreshToken=abc123; HttpOnly; Secure; Max-Age=2592000000
          description: Sets a refresh token cookie
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/components/schemas/Error'
    '401':
      description: Invalid email or password
      content:
        application/json:
          schema:
            $ref: '../../components/schemas.yaml#/components/schemas/Error'
